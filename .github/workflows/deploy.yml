name: Deploy to GitHub Pages

# Fires on whichever of these branches the repo ends up using, so renaming the
# default branch to main later needs no edit here.
on:
  push:
    branches:
      - main
      - claude/cache-mobile-app-4tr2ws
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # No enablement: true here. The Pages site has to already exist —
      # GITHUB_TOKEN is refused on the create endpoint with "Resource not
      # accessible by integration", and asking turns a clear error into a
      # confusing one.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
